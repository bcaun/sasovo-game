# /etc/nginx/sites-available/sasovo.conf
# Страница отдаётся из public/, онлайн-режим — через игровой сервер на 127.0.0.1:8787.
# HTTPS добавляет certbot:  certbot --nginx -d sasovo.daagamma.com --redirect
server {
    listen 80;
    listen [::]:80;
    server_name sasovo.daagamma.com;

    root /var/www/sasovo-game/public;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    gzip on;
    gzip_types text/css application/javascript;
}
