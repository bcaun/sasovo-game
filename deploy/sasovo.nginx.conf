# /etc/nginx/sites-available/sasovo.conf
# Сайт отдаётся из папки public/ клона репозитория. HTTPS добавляет certbot:
#   certbot --nginx -d sasovo.daagamma.com --redirect
server {
    listen 80;
    listen [::]:80;
    server_name sasovo.daagamma.com;

    root /var/www/sasovo-game/public;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript;
}
