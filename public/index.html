<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Дорога в Сасово — железнодорожная стратегия по карте Подмосковья и Рязанской области.">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Дорога в Сасово</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=PT+Serif:ital,wght@0,400;0,700;1,400&family=PT+Sans:wght@400;700&family=PT+Mono&display=swap">
<style>
/* Layout: map board on the left, dispatcher's ledger (game / map tabs) on the right; stacks on phones. */
:root{
  --bg:#e9eef0;--panel:#f7f9fa;--ink:#1d2a33;--muted:#5f707b;--line:#c9d3d8;
  --land:#dfe7dc;--moscow:#f1f0e2;--ryazan:#e8efe0;--vladimir:#e6ebe6;--border:#8f9c84;--water:#7fb2cf;
  --accent:#1f6f8b;--glow:#ffcc33;--city:#ffffff;--cityRing:#1d2a33;--carStroke:rgba(20,30,36,.55);
  --ckad:#e39a2d;--bmo:#7a5a3c;--express:#3aa0d8;--ticket:#fbf7ea;--ticketInk:#3b3426;--good:#2e8b57;--bad:#c0392b;
  --font-display:"Old Standard TT","PT Serif",Georgia,serif;
  --font-map:"PT Serif",Georgia,serif;
  /* the board itself is a printed paper map: same look in light and dark UI */
  --paper:#f2e6c4;--paperOut:#ddcfa6;--mapInk:#3b2f1e;--mapMuted:#7d6a48;--mapWater:#6d9bb5;--mapWaterDeep:#4f7f9c;
  --washM:#c4784a;--washR:#6f9a4e;--washV:#8b74ad;--forest:#55703f;--forestLight:#7f9a5c;
  --font-body:"PT Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"PT Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11181d;--panel:#172128;--ink:#e3eaee;--muted:#93a4ae;--line:#2b3a43;
  --land:#1a2329;--moscow:#232d2a;--ryazan:#1f2b26;--vladimir:#1d2629;--border:#5c6e5a;--water:#3b7393;
  --accent:#5fb7d6;--glow:#ffcc33;--city:#e9eef0;--cityRing:#0c1115;--carStroke:rgba(0,0,0,.6);
  --ckad:#c98426;--bmo:#a8825c;--express:#4fb3e8;--ticket:#2a2820;--ticketInk:#ece3c8;--good:#5cc28a;--bad:#e8705f;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11181d;--panel:#172128;--ink:#e3eaee;--muted:#93a4ae;--line:#2b3a43;
  --land:#1a2329;--moscow:#232d2a;--ryazan:#1f2b26;--vladimir:#1d2629;--border:#5c6e5a;--water:#3b7393;
  --accent:#5fb7d6;--glow:#ffcc33;--city:#e9eef0;--cityRing:#0c1115;--carStroke:rgba(0,0,0,.6);
  --ckad:#c98426;--bmo:#a8825c;--express:#4fb3e8;--ticket:#2a2820;--ticketInk:#ece3c8;--good:#5cc28a;--bad:#e8705f;color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 24px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px;margin-bottom:12px}
h1{font-family:var(--font-display);font-weight:700;font-size:clamp(20px,3vw,28px);letter-spacing:.01em;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:14px}
.tag{font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);padding:2px 7px;border-radius:3px;color:var(--muted)}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:14px;align-items:start}
@media (max-width:980px){.wrap{grid-template-columns:minmax(0,1fr)}}
@media (max-width:600px){.board{height:min(72vh,560px)}}
.board{position:relative;background:var(--paperOut);border:1px solid var(--line);border-radius:6px;overflow:hidden;height:clamp(460px,86vh,1000px);touch-action:none}
svg#map{width:100%;height:100%;display:block;cursor:grab;user-select:none}
svg#map.panning{cursor:grabbing}
.zoom{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:4px}
.zoom button{width:34px;height:34px;font-size:18px;padding:0}
button{font-family:var(--font-body);font-size:14px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:6px 10px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--accent)}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:var(--accent);color:var(--panel);border-color:var(--accent);font-weight:700}
button:focus-visible,input:focus-visible,li:focus-visible,select:focus-visible,.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=text],select{font-family:var(--font-body);font-size:14px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:5px 8px}
.tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:5px 8px;font-size:13px;box-shadow:0 2px 8px rgba(0,0,0,.15);white-space:nowrap;z-index:5}
.hint{position:absolute;left:10px;bottom:10px;font-size:12.5px;color:var(--mapInk);background:color-mix(in srgb,var(--paper) 92%,transparent);border:1px solid var(--mapMuted);padding:5px 9px;border-radius:4px;max-width:calc(100% - 20px)}

aside{display:flex;flex-direction:column;gap:12px;min-width:0}
.tabs{display:flex;gap:4px}
.tabs button{flex:1}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.sec{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px;min-width:0}
.sec h2{font-family:var(--font-mono);font-weight:400;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;display:flex;justify-content:space-between;gap:8px}
.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.chain{font-size:13px;color:var(--muted)}
.chain b{color:var(--ink);font-weight:700}

/* players */
.players{display:flex;flex-direction:column;gap:4px}
.pl{display:grid;grid-template-columns:14px 1fr auto auto auto;gap:8px;align-items:center;padding:5px 6px;border-radius:4px;font-size:14px}
.pl.cur{background:color-mix(in srgb,var(--accent) 13%,transparent);font-weight:700}
.pl i{width:12px;height:12px;border-radius:50%;display:block;border:1.5px solid var(--cityRing)}
.pl span.num{font-size:13px;color:var(--muted);min-width:44px;text-align:right}
.pl span.num b{color:var(--ink)}
.turn{font-family:var(--font-display);font-weight:500;font-size:16px;margin:0 0 4px}
.status{font-size:13.5px;color:var(--muted)}

/* train cards */
.cards{display:flex;flex-wrap:wrap;gap:6px}
.card{position:relative;width:58px;height:40px;border-radius:5px;border:1.5px solid var(--carStroke);display:flex;align-items:flex-end;justify-content:flex-end;padding:2px 4px;cursor:pointer;
  background:var(--c);box-shadow:inset 0 0 0 3px color-mix(in srgb,#fff 30%,transparent)}
.card svg{position:absolute;left:5px;top:7px;width:36px;height:18px}
.card b{font-family:var(--font-mono);font-size:13px;background:var(--panel);color:var(--ink);border-radius:3px;padding:0 4px;line-height:1.3}
.card.loco{background:conic-gradient(from 45deg,#d1453b,#e58a2b,#e9c440,#4a9a5b,#3a74c4,#8a5bb8,#d1453b)}
.card.back{background:repeating-linear-gradient(135deg,var(--accent) 0 6px,color-mix(in srgb,var(--accent) 70%,var(--panel)) 6px 12px)}
.card.static{cursor:default}
.card.hl{outline:3px solid var(--glow);outline-offset:1px}
.card:disabled,.card[aria-disabled="true"]{opacity:.4;cursor:not-allowed}
.handcard{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted)}

/* tickets */
.tlist{display:flex;flex-direction:column;gap:6px;max-height:300px;overflow:auto}
.ticket{background:var(--ticket);color:var(--ticketInk);border:1px solid color-mix(in srgb,var(--ticketInk) 25%,transparent);border-radius:5px;padding:7px 10px;
  display:grid;grid-template-columns:1fr auto;gap:2px 8px;cursor:pointer;position:relative;text-align:left;font-size:14px;width:100%}
.ticket::before{content:"";position:absolute;left:-1px;top:50%;width:8px;height:14px;margin-top:-7px;border-radius:0 8px 8px 0;background:var(--panel);border:1px solid color-mix(in srgb,var(--ticketInk) 25%,transparent);border-left:none}
.ticket .route{font-weight:700}
.ticket .pts{font-family:var(--font-display);font-weight:700;font-size:18px;grid-row:span 2;align-self:center}
.ticket .meta{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;opacity:.7}
.ticket.long{border-color:var(--glow);box-shadow:inset 4px 0 0 var(--glow)}
.ticket.done{box-shadow:inset 4px 0 0 var(--good)}
.ticket.done .meta{color:var(--good);opacity:1}
.ticket.pick{outline:2px solid transparent}
.ticket.pick[aria-pressed="true"]{outline:2.5px solid var(--accent)}
.ticket.pick[aria-pressed="false"]{opacity:.7}
.ticket.pick[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--accent)}

.log{font-size:12.5px;color:var(--muted);max-height:150px;overflow:auto;display:flex;flex-direction:column;gap:2px}
.log div b{color:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center}

/* modal */
.modal{position:fixed;inset:0;background:rgba(10,16,20,.55);display:flex;align-items:center;justify-content:center;z-index:20;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dialog{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:18px 20px;width:min(560px,100%);max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:12px}
.dialog h3{font-family:var(--font-display);font-weight:500;font-size:19px;margin:0}
.dialog p{margin:0;color:var(--muted);font-size:14px}
.setup-row{display:grid;grid-template-columns:16px 1fr auto;gap:8px;align-items:center}
.setup-row i{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--cityRing)}
.paybtns{display:flex;flex-direction:column;gap:6px}
.paybtns button{display:flex;align-items:center;gap:8px;text-align:left}
.paybtns em{display:inline-block;width:18px;height:12px;border-radius:2px;border:1px solid var(--carStroke)}
.rules{font-size:14px;color:var(--ink);display:flex;flex-direction:column;gap:6px}
.rules h4{margin:6px 0 0;font-size:13px;font-family:var(--font-mono);font-weight:400;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.rules ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
table.res{border-collapse:collapse;width:100%;font-size:14px}
table.res th,table.res td{white-space:nowrap;padding:5px 6px;border-bottom:1px solid var(--line);text-align:right}
table.res th:first-child,table.res td:first-child{text-align:left}
.tablewrap{overflow-x:auto}

/* map-tab bits */
.lines{display:flex;flex-direction:column;gap:6px}
.line{border:1px solid var(--line);border-left-width:5px;border-radius:4px;padding:8px 10px;cursor:pointer}
.line:hover,.line.on{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.line[data-k="main"]{border-left-color:var(--glow)}
.line[data-k="alt"]{border-left-color:#a3a9b0}
.line[data-k="north"]{border-left-color:var(--express)}
.line .t{display:flex;justify-content:space-between;gap:8px;font-weight:700}
.line .d{font-size:12.5px;color:var(--muted)}
.legend{display:grid;grid-template-columns:42px 1fr;gap:6px 10px;align-items:center;font-size:13px}
.legend svg{width:42px;height:16px;display:block}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.stats div{display:flex;flex-direction:column}
.stats .num{font-size:20px}
.stats span{font-size:12px;color:var(--muted)}
.toggles{display:flex;flex-direction:column;gap:6px;font-size:14px}
.toggles label{display:flex;gap:8px;align-items:center;cursor:pointer}

/* map layers: printed paper board */
.paper-out{fill:var(--paperOut)}
.region-fill{fill:var(--paper)}
.region-line{fill:none;stroke:var(--mapMuted);stroke-width:1.4;stroke-dasharray:9 3 2 3;opacity:.85}
.region-label{font-family:var(--font-map);font-style:italic;font-size:17px;letter-spacing:.18em;fill:var(--mapMuted);opacity:.75}
.neigh{font-family:var(--font-map);font-size:13px;letter-spacing:.14em;fill:var(--mapMuted);opacity:.7}
.ml-area{font-family:var(--font-display);font-weight:700;font-size:20px;letter-spacing:.2em;fill:var(--forest);opacity:.6}
.ml-relief{font-family:var(--font-map);font-style:italic;font-size:12px;letter-spacing:.12em;fill:#8a6a3c;opacity:.85}
.ml-river{font-family:var(--font-map);font-style:italic;font-size:12px;fill:var(--mapWaterDeep)}
.tree-con{fill:var(--forest);opacity:.5}
.tree-dec{fill:var(--forestLight);opacity:.45}
.marsh{fill:none;stroke:#6f8a6a;stroke-width:1;opacity:.6}
.relief{fill:none;stroke:#9c7a48;stroke-width:1.3;opacity:.6;stroke-linecap:round}
.lake{fill:#a9c6d4;stroke:var(--mapWater);stroke-width:1}
.river{fill:none;stroke:var(--mapWater);stroke-linecap:round;stroke-linejoin:round}
.river-bank{fill:none;stroke:#cfe0e6;stroke-linecap:round;stroke-linejoin:round;opacity:.8}
.grain{pointer-events:none;mix-blend-mode:multiply}
.cmp-ring{fill:none;stroke:var(--mapMuted);stroke-width:1.2}.cmp-ring.thin{stroke-width:.6}
.cmp-a{fill:var(--mapInk);opacity:.75}.cmp-b{fill:var(--paper);stroke:var(--mapInk);stroke-width:.6}
.cmp-t{font-family:var(--font-display);font-weight:700;font-size:13px;fill:var(--mapInk)}
.ct-box{fill:var(--paper);stroke:var(--mapInk);stroke-width:1.6}
.ct-inner{fill:none;stroke:var(--washM);stroke-width:1}
.ct-title{font-family:var(--font-display);font-weight:700;font-size:25px;fill:var(--mapInk)}
.ct-sub{font-family:var(--font-map);font-style:italic;font-size:12px;fill:var(--mapMuted);letter-spacing:.06em}
.scale-l{fill:none;stroke:var(--mapInk);stroke-width:1.4}
.ring-ckad{fill:none;stroke:var(--ckad);stroke-width:30;opacity:.22;stroke-linejoin:round}
.ring-ckad-c{fill:none;stroke:var(--ckad);stroke-width:2;stroke-dasharray:10 8;opacity:.9;stroke-linejoin:round}
.ring-bmo{fill:none;stroke:var(--bmo);stroke-width:26;stroke-dasharray:2.5 5;opacity:.38;stroke-linejoin:round}
.ring-label{font-family:var(--font-display);font-weight:700;font-size:14px;letter-spacing:.12em;paint-order:stroke;stroke:var(--paper);stroke-width:4px;stroke-linejoin:round}
.ring-label.ckad{fill:#b8701c}
.ring-label.bmo{fill:#6b4b2c}
#routes{filter:url(#carShadow)}
.casing{fill:none;stroke-linecap:round}
.casing.express{stroke:var(--express);opacity:.4}
.casing.main{stroke:#e8b020;opacity:.35}
.car{stroke:rgba(40,28,12,.6);stroke-width:1}
.trk{cursor:pointer}
.trk .halo{fill:none;stroke:transparent;stroke-width:16}
.trk:hover .car{stroke:var(--mapInk);stroke-width:1.6}
.trk.on .car{stroke:#ffcc33;stroke-width:2.6}
.trk.owned .car{stroke:#1b1309;stroke-width:1.6}
.trk.blocked{opacity:.25}
.trk.can .car{stroke:#1f6f8b;stroke-width:2}
.dim .trk:not(.on):not(.owned){opacity:.3}
.dim .casing{opacity:.12}
.city circle{fill:#fffaf0;stroke:var(--mapInk);stroke-width:2.2;cursor:pointer}
.city circle.ckad-st{fill:none;stroke:var(--ckad);stroke-width:3;pointer-events:none}
.city.big circle{stroke-width:3}
.city.big circle.dot{fill:var(--mapInk);stroke:none;pointer-events:none}
.city.sel circle:not(.ckad-st):not(.dot){fill:#1f6f8b}
.city.end circle:not(.ckad-st):not(.dot){fill:#ffcc33}
.city text{font-family:var(--font-map);font-weight:700;font-size:12.5px;fill:var(--mapInk);paint-order:stroke;stroke:var(--paper);stroke-width:3.5px;stroke-linejoin:round;pointer-events:none}
.city.big text{font-family:var(--font-display);font-weight:700;font-size:15.5px}
.city.exit circle{fill:var(--paper);stroke-dasharray:3 2}
.city.exit text{font-style:italic;font-weight:400;fill:var(--mapMuted)}
.nolabels .city text{display:none}
@media (prefers-reduced-motion:no-preference){.trk .car{transition:opacity .2s}}
</style>
</head>
<body>
<header>
  <h1>Дорога в Сасово</h1>
  <span class="sub">Железнодорожная стратегия · Москва, Рязань, Владимир</span>
  <span class="tag">v0.5</span>
</header>

<div class="wrap">
  <div class="board" id="board">
    <svg id="map" xmlns="http://www.w3.org/2000/svg" aria-label="Игровая карта железных дорог">
      <g id="vp"><g id="geo"></g><g id="rings"></g><g id="routes"></g><g id="cities"></g></g>
    </svg>
    <div class="zoom">
      <button id="zin" aria-label="Приблизить">+</button>
      <button id="zout" aria-label="Отдалить">−</button>
      <button id="zfit" aria-label="Показать всю карту">⤢</button>
    </div>
    <div class="tip" id="tip" hidden></div>
    <div class="hint" id="hint"></div>
  </div>

  <aside>
    <div class="tabs" role="tablist">
      <button role="tab" id="tabGame" aria-selected="true">Игра</button>
      <button role="tab" id="tabMap" aria-selected="false">Карта</button>
      <button role="tab" id="tabRules" aria-selected="false">Правила</button>
    </div>

    <div id="paneGame">
      <section class="sec">
        <p class="turn" id="turnTitle">—</p>
        <div class="status" id="status"></div>
        <div class="players" id="players" style="margin-top:8px"></div>
      </section>
      <section class="sec" style="margin-top:12px">
        <h2><span>Рынок карт</span><span id="deckInfo" class="num"></span></h2>
        <div class="cards" id="market"></div>
      </section>
      <section class="sec" style="margin-top:12px">
        <h2><span id="handTitle">Рука</span><span id="handCount" class="num"></span></h2>
        <div class="cards" id="hand"></div>
        <div class="row">
          <button id="btnTickets">Взять маршрутные билеты</button>
        </div>
      </section>
      <section class="sec" style="margin-top:12px">
        <h2><span>Маршрутные билеты</span><span id="tCount" class="num"></span></h2>
        <div class="tlist" id="myTickets"></div>
      </section>
      <section class="sec" style="margin-top:12px">
        <h2><span>Журнал</span><button id="btnNew" style="padding:2px 8px;font-size:12px">Новая игра</button></h2>
        <div class="log" id="log"></div>
      </section>
    </div>

    <div id="paneMap" hidden>
      <section class="sec">
        <h2>Москва → Сасово: три пути</h2>
        <div class="lines" id="lines"></div>
      </section>
      <section class="sec" style="margin-top:12px">
        <h2>Путь между городами</h2>
        <div id="sel">Нажмите два города на карте.</div>
      </section>
      <section class="sec" style="margin-top:12px">
        <h2>Условные обозначения</h2>
        <div class="legend" id="legend"></div>
      </section>
      <section class="sec" style="margin-top:12px">
        <h2>Баланс карты</h2>
        <div class="stats" id="stats"></div>
      </section>
      <section class="sec" style="margin-top:12px">
        <h2>Слои</h2>
        <div class="toggles">
          <label><input type="checkbox" id="tRivers" checked> Реки</label>
          <label><input type="checkbox" id="tBorders" checked> Границы областей</label>
          <label><input type="checkbox" id="tRings" checked> ЦКАД и БМО</label>
          <label><input type="checkbox" id="tLabels" checked> Названия городов</label>
        </div>
      </section>
    </div>

    <div id="paneRules" hidden>
      <section class="sec rules" id="rulesBox"></section>
    </div>
  </aside>
</div>

<div class="modal" id="modal" hidden><div class="dialog" id="dialog" role="dialog" aria-modal="true"></div></div>

<script>
(()=>{
// =====================================================================
// MAP DATA
// =====================================================================
const K=260, C=Math.cos(55*Math.PI/180);
const raw=(lon,lat)=>[(lon-35)*K*C,(57.1-lat)*K];
const [MX,MY]=raw(37.62,55.75);

// shortest path in cars over pairs, with optional cost function per pair
function shortest(s,t,costFn){
  const adj={};
  Object.entries(groups).forEach(([k,g])=>{const w=costFn?costFn(g):Math.min(...g.map(x=>x.cars));if(w===Infinity)return;
    const [a,b]=k.split("|");(adj[a]??=[]).push([b,w,k]);(adj[b]??=[]).push([a,w,k])});
  const d={},prev={},done=new Set(); Object.keys(cities).forEach(k=>d[k]=Infinity); d[s]=0;
  for(;;){let u=null;for(const k in d)if(!done.has(k)&&d[k]<Infinity&&(u===null||d[k]<d[u]))u=k;
    if(u===null||u===t)break;done.add(u);
    for(const [v,w,k] of adj[u]||[])if(d[u]+w<d[v]){d[v]=d[u]+w;prev[v]=[u,k]}}
  if(d[t]===Infinity)return null;
  const nodes=[t],keys=[];let cur=t;while(cur!==s){const [p,k]=prev[cur];keys.push(k);nodes.push(p);cur=p}
  return {cars:d[t],nodes:nodes.reverse(),keys:keys.reverse()};
}

  G={players:cfg.map((c,i)=>({name:c.name,bot:c.bot,color:PLAYER_COLORS[i][0],cars:CARS_PER_PLAYER,score:0,
      hand:Object.fromEntries([...CARD_COLORS,"loco"].map(k=>[k,0])),tickets:[]})),
    deck:shuffle(deck),discard:[],market:[],shortDeck:shuffle(REGULAR_TICKETS.map(t=>({...t}))),longDeck:shuffle(LONG_TICKETS.map(t=>({...t}))),longOut:[],
    owner:{},turn:0,drawn:0,finalLeft:null,over:false,log:[],setupQueue:[]};
  G.players.forEach(p=>{for(let i=0;i<4;i++)p.hand[drawDeck()]++});
  refillMarket();
  log("Новая игра: "+G.players.map(p=>esc(p.name)).join(", ")+".");
  // initial tickets: 1 long + 3 short, keep at least 2
  G.players.forEach((p,i)=>G.setupQueue.push(i));
  nextSetup();
}
function log(html){G.log.unshift(html);if(G.log.length>80)G.log.pop()}
function drawDeck(){
  if(!G.deck.length&&G.discard.length){G.deck=shuffle(G.discard);G.discard=[];log("Сброс перемешан в колоду.")}
  return G.deck.pop()||null;
}
function refillMarket(){
  for(let guard=0;guard<4;guard++){
    while(G.market.length<5){const c=drawDeck();if(!c)break;G.market.push(c)}
    if(G.market.filter(c=>c==="loco").length>=3&&(G.deck.length+G.discard.length)>=5){
      G.discard.push(...G.market);G.market=[];log("На рынке три тепловоза: рынок обновлён.");
    } else break;
  }
}
const cur=()=>G.players[G.turn];
const viewer=()=>{if(!cur().bot)return cur();return G.players.find(p=>!p.bot)||cur()};

// ----- tickets -----
function nextSetup(){
  if(!G.setupQueue.length){G.phase="play";startTurn();return}
  const i=G.setupQueue.shift(),p=G.players[i];
  const offer=[G.longDeck.pop(),...G.shortDeck.splice(-START_REGULAR)].filter(Boolean);
  G.phase="setup";G.turn=i;
  if(p.bot){keepTickets(p,botChooseTickets(p,offer,START_MIN),offer);nextSetup()}
  else showTicketChoice(p,offer,START_MIN,()=>nextSetup(),true);
}
function keepTickets(p,keep,offer){
  keep.forEach(t=>p.tickets.push(t));
  // отказ от дальнего маршрута окончательный: он уходит из игры; обычные — под низ колоды
  offer.filter(t=>!keep.includes(t)).forEach(t=>t.long?G.longOut.push(t):G.shortDeck.unshift(t));
  log(`<b>${esc(p.name)}</b> оставляет билетов: ${keep.length}.`);
}
function takeTicketsAction(){
  if(!canAct()||G.drawn>0)return;
  const p=cur(),offer=G.shortDeck.splice(-DRAW_TICKETS);
  if(!offer.length){flash("Билеты закончились.");return}
  showTicketChoice(p,offer,DRAW_MIN,()=>endTurn(),false);
}

// ----- connectivity -----
function ownedAdj(pi){
  const adj={};tracks.forEach(t=>{if(G.owner[t.id]===pi){(adj[t.a]??=[]).push(t);(adj[t.b]??=[]).push(t)}});return adj;
}
function connected(pi,a,b){
  const adj=ownedAdj(pi),seen=new Set([a]),st=[a];
  while(st.length){const u=st.pop();if(u===b)return true;for(const t of adj[u]||[]){const v=t.a===u?t.b:t.a;if(!seen.has(v)){seen.add(v);st.push(v)}}}
  return false;
}
function longestTrail(pi){
  const adj=ownedAdj(pi);let best=0;const used=new Set();
  const dfs=(u,len)=>{best=Math.max(best,len);for(const t of adj[u]||[]){if(used.has(t.id))continue;used.add(t.id);dfs(t.a===u?t.b:t.a,len+t.cars);used.delete(t.id)}};
  Object.keys(adj).forEach(u=>dfs(u,0));return best;
}
function refreshTicketStatus(pi){
  const p=G.players[pi];p.tickets.forEach(t=>{const was=t.done;t.done=connected(pi,t.a,t.b);
    if(t.done&&!was&&!p.bot)flash(`Маршрут выполнен: ${tName(t)} (+${t.pts})`)});
}

// ----- claiming -----
function trackBlockReason(pi,t){
  if(G.owner[t.id]!==undefined)return "Перегон уже занят.";
  const g=groups[t.key];
  if(g.some(x=>G.owner[x.id]===pi))return "Второй путь этого перегона нельзя занять тому же игроку.";
  if(G.players.length<=3&&g.length>1&&g.some(x=>G.owner[x.id]!==undefined))return "При 2–3 игроках двойной перегон закрывается после первой постройки.";
  if(G.players[pi].cars<t.cars)return "Не хватает вагонов.";
  return null;
}
function payOptions(p,t){
  const need=cardCost(t),opts=[],cols=t.color==="gray"?CARD_COLORS:[t.color];
  cols.forEach(c=>{const h=p.hand[c];if(t.color==="gray"&&h===0)return;
    if(h+p.hand.loco>=need){const use=Math.min(h,need);opts.push({c,use,loco:need-use})}});
  if(p.hand.loco>=need&&!opts.some(o=>o.use===0))opts.push({c:t.color==="gray"?"loco":t.color,use:0,loco:need});
  return opts.sort((x,y)=>x.loco-y.loco);
}
function claim(pi,t,opt){
  const p=G.players[pi];
  if(opt.use){p.hand[opt.c]-=opt.use;for(let i=0;i<opt.use;i++)G.discard.push(opt.c)}
  if(opt.loco){p.hand.loco-=opt.loco;for(let i=0;i<opt.loco;i++)G.discard.push("loco")}
  G.owner[t.id]=pi;p.cars-=t.cars;const pts=trackPoints(t);p.score+=pts;
  log(`<b>${esc(p.name)}</b> строит ${esc(cities[t.a].n)} — ${esc(cities[t.b].n)} (${t.cars} ваг., +${pts}).`);
  refreshTicketStatus(pi);
  endTurn();
}

// ----- drawing cards -----
function takeMarket(i){
  if(!canAct())return;const c=G.market[i];if(!c)return;
  if(c==="loco"&&G.drawn>0){flash("Тепловоз с рынка можно взять только первой картой.");return}
  const p=cur();p.hand[c]++;G.market.splice(i,1);refillMarket();
  log(`<b>${esc(p.name)}</b> берёт с рынка: ${c==="loco"?"тепловоз":COLORS[c][1]}.`);
  if(c==="loco"){endTurn();return}
  afterDraw();
}
function takeDeck(){
  if(!canAct())return;const c=drawDeck();if(!c){flash("Колода пуста.");return}
  cur().hand[c]++;log(`<b>${esc(cur().name)}</b> берёт карту из колоды.`);afterDraw();
}
function afterDraw(){
  G.drawn++;
  const nothingLeft=!G.deck.length&&!G.discard.length&&!G.market.some(c=>c!=="loco");
  if(G.drawn>=2||nothingLeft)endTurn(); else render();
}

// ----- turn flow -----
const canAct=()=>G&&G.phase==="play"&&!G.over&&!cur().bot&&$("modal").hidden;
function startTurn(){
  G.drawn=0;clearHL();render();
  if(cur().bot)setTimeout(botTurn,650);
}
function endTurn(){
  const p=cur();
  if(G.finalLeft===null&&p.cars<=2){G.finalLeft=G.players.length;log(`<b>${esc(p.name)}</b>: осталось ${p.cars} ваг. Каждый делает последний ход.`)}
  if(G.finalLeft!==null){G.finalLeft--;if(G.finalLeft<=0){finishGame();return}}
  G.turn=(G.turn+1)%G.players.length;startTurn();
}
function finishGame(){
  G.over=true;
  const rows=G.players.map((p,i)=>{let tp=0,tm=0;p.tickets.forEach(t=>t.done?tp+=t.pts:tm+=t.pts);
    const ck=tracks.filter(t=>G.owner[t.id]===i&&t.type==="ckad").length,bm=tracks.filter(t=>G.owner[t.id]===i&&t.type==="bmo").length;
    return {p,i,route:p.score,tp,tm,ck,bm,lt:longestTrail(i)}});
  const best=f=>{const m=Math.max(...rows.map(f));return m>0?m:Infinity};
  const mCk=best(r=>r.ck),mBm=best(r=>r.bm),mLt=best(r=>r.lt);
  rows.forEach(r=>{r.bCk=r.ck===mCk?RING_BONUS:0;r.bBm=r.bm===mBm?RING_BONUS:0;r.bLt=r.lt===mLt?LONGEST_BONUS:0;
    r.total=r.route+r.tp-r.tm+r.bCk+r.bBm+r.bLt});
  rows.sort((a,b)=>b.total-a.total);
  log(`Игра окончена. Победитель: <b>${esc(rows[0].p.name)}</b>.`);
  render();
  openModal(`<h3>Итоги: побеждает ${esc(rows[0].p.name)}</h3>
   <div class="tablewrap"><table class="res"><tr><th>Игрок</th><th>Перегоны</th><th>Билеты +</th><th>Билеты −</th><th>ЦКАД</th><th>БМО</th><th>Длинный путь</th><th>Итого</th></tr>
   ${rows.map(r=>`<tr><td>${esc(r.p.name)}</td><td class="num">${r.route}</td><td class="num">+${r.tp}</td><td class="num">−${r.tm}</td>
     <td class="num">${r.ck} → +${r.bCk}</td><td class="num">${r.bm} → +${r.bBm}</td><td class="num">${r.lt} → +${r.bLt}</td><td class="num"><b>${r.total}</b></td></tr>`).join("")}
   </table></div><div class="row"><button class="primary" id="mNew">Новая игра</button><button id="mClose">Посмотреть карту</button></div>`);
  $("mNew").onclick=()=>{closeModal();showSetup()};$("mClose").onclick=closeModal;
}

// BOT
// =====================================================================
function botNeeds(pi){
  const p=G.players[pi],need=new Map();
  const cost=g=>{if(g.some(t=>G.owner[t.id]===pi))return 0;const free=g.filter(t=>!trackBlockReason(pi,t));
    return free.length?Math.min(...free.map(t=>t.cars)):Infinity};
  p.tickets.filter(t=>!t.done).forEach(tk=>{const path=shortest(tk.a,tk.b,cost);if(!path)return;
    path.keys.forEach(k=>{const g=groups[k];if(g.some(t=>G.owner[t.id]===pi))return;
      g.filter(t=>!trackBlockReason(pi,t)).forEach(t=>need.set(t.id,t))})});
  return [...need.values()];
}
function botChooseTickets(p,offer,min){
  const sc=offer.map(t=>({t,c:shortest(t.a,t.b).cars})).sort((a,b)=>(a.c-a.t.pts*0.3)-(b.c-b.t.pts*0.3));
  const keep=sc.filter((x,i)=>i<min||x.c<=8).map(x=>x.t);return keep.slice(0,Math.max(min,3));
}
function botTurn(){
  if(!G||G.over||!cur().bot)return;
  const pi=G.turn,p=cur();
  const needs=botNeeds(pi).sort((a,b)=>b.cars-a.cars);
  for(const t of needs){const o=payOptions(p,t);if(o.length){claim(pi,t,o[0]);return}}
  if(!needs.length){
    if(G.shortDeck.length&&p.cars>12&&p.tickets.length<7){
      const offer=G.shortDeck.splice(-DRAW_TICKETS);
      keepTickets(p,botChooseTickets(p,offer,DRAW_MIN),offer);endTurn();return}
    const any=tracks.filter(t=>!trackBlockReason(pi,t)&&t.cars>=2).sort((a,b)=>b.cars-a.cars);
    for(const t of any){const o=payOptions(p,t);if(o.length){claim(pi,t,o[0]);return}}
  }
  // draw two cards towards what is needed
  const want=new Set(needs.map(t=>t.color).filter(c=>c!=="gray"));
  const drawOne=first=>{
    const i=G.market.findIndex(c=>want.has(c));
    if(i>=0){const c=G.market[i];p.hand[c]++;G.market.splice(i,1);refillMarket();log(`<b>${esc(p.name)}</b> берёт с рынка: ${COLORS[c][1]}.`);return true}
    if(first&&G.market.includes("loco")&&Math.random()<.35){const j=G.market.indexOf("loco");p.hand.loco++;G.market.splice(j,1);refillMarket();log(`<b>${esc(p.name)}</b> берёт тепловоз.`);return "loco"}
    const c=drawDeck();if(c){p.hand[c]++;log(`<b>${esc(p.name)}</b> берёт карту из колоды.`);return true}
    const k=G.market.findIndex(c=>c!=="loco");if(k>=0){const c2=G.market[k];p.hand[c2]++;G.market.splice(k,1);refillMarket();return true}
    return false};
  const r=drawOne(true);
  if(r===true)drawOne(false);
  if(r===false){
    // nothing to draw: build anything possible
    const any=tracks.filter(t=>!trackBlockReason(pi,t)).sort((a,b)=>b.cars-a.cars);
    for(const t of any){const o=payOptions(p,t);if(o.length){claim(pi,t,o[0]);return}}
    log(`<b>${esc(p.name)}</b> пропускает ход.`);
  }
  endTurn();
}

const rng=seed=>()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};
const inPoly=(x,y,poly)=>{let c=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const [xi,yi]=poly[i],[xj,yj]=poly[j];
  if((yi>y)!==(yj>y)&&x<(xj-xi)*(y-yi)/(yj-yi)+xi)c=!c}return c};
const proj=a=>a.map(([lo,la])=>P(lo,la));
function smooth(p,closed){ // Catmull-Rom → cubic Bézier
  const n=p.length,g=i=>p[closed?(i+n)%n:Math.max(0,Math.min(n-1,i))];let d=`M${p[0][0].toFixed(1)},${p[0][1].toFixed(1)}`;
  for(let i=0;i<(closed?n:n-1);i++){const p0=g(i-1),p1=g(i),p2=g(i+1),p3=g(i+2);
    d+=` C${(p1[0]+(p2[0]-p0[0])/6).toFixed(1)},${(p1[1]+(p2[1]-p0[1])/6).toFixed(1)} ${(p2[0]-(p3[0]-p1[0])/6).toFixed(1)},${(p2[1]-(p3[1]-p1[1])/6).toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`}
  return d+(closed?"Z":"");
}
function segDist(px,py,ax,ay,bx,by){const L=(bx-ax)**2+(by-ay)**2,t=Math.max(0,Math.min(1,((px-ax)*(bx-ax)+(py-ay)*(by-ay))/L));return Math.hypot(px-ax-t*(bx-ax),py-ay-t*(by-ay))}
// keep decoration away from tracks, stations and their labels
function clearOfPlay(x,y,pad=14){
  for(const k in groups){const [a,b]=k.split("|"),A=cities[a],B=cities[b];if(segDist(x,y,A.x,A.y,B.x,B.y)<pad+groups[k].length*5)return false}
  for(const c of Object.values(cities)){if(Math.hypot(x-c.x,y-c.y)<pad+10)return false;
    const [lx,ly,anc]=LABEL_POS[c.id]||[10,4],w=(c.n.length+2)*7.2,x0=c.x+lx-(anc==="end"?w:anc==="middle"?w/2:0);
    if(x>x0-4&&x<x0+w+4&&y>c.y+ly-14&&y<c.y+ly+6)return false}
  return true;
}

  $("legend").innerHTML=[
    [sw(`<rect x="0" y="1" width="42" height="14" fill="var(--glow)" opacity=".35"/>${cars(2,"#d1453b")}${cars(9,"#3a74c4")}`),"Основная магистраль, два пути"],
    [sw(`<rect x="0" y="1" width="42" height="14" fill="var(--express)" opacity=".45"/>${cars(5,"#3a74c4")}`),"Скоростная: на 1 карту дороже, вагонов меньше, +2 очка"],
    [sw(cars(5,"#a3a9b0")),"Серый путь: карты любого одного цвета"],
    [sw(`<rect x="0" y="1" width="42" height="14" fill="var(--ckad)" opacity=".28"/><line x1="0" y1="8" x2="42" y2="8" stroke="var(--ckad)" stroke-width="2" stroke-dasharray="6 5"/>`),"ЦКАД"],
    [sw(`<line x1="0" y1="8" x2="42" y2="8" stroke="var(--bmo)" stroke-width="14" stroke-dasharray="2.5 5" opacity=".6"/>`),"Большое бетонное кольцо"],
    [sw(`<circle cx="21" cy="8" r="7" fill="none" stroke="var(--ckad)" stroke-width="2.5"/><circle cx="21" cy="8" r="3.6" fill="var(--city)" stroke="var(--cityRing)" stroke-width="1.6"/>`),"Станция на ЦКАД"],
    [sw(`<circle cx="21" cy="8" r="5" fill="var(--panel)" stroke="var(--cityRing)" stroke-width="1.6" stroke-dasharray="3 2"/>`),"Вылетное направление за край карты"],
  ].map(([s,t])=>`${s}<span>${t}</span>`).join("");
  const total=tracks.reduce((a,t)=>a+t.cars,0);
  $("stats").innerHTML=`<div><b class="num">${Object.values(cities).filter(c=>!c.exit).length}</b><span>городов</span></div><div><b class="num">${tracks.length}</b><span>путей</span></div><div><b class="num">${total}</b><span>вагонов на карте</span></div>`;
}
function renderRules(){
  $("rulesBox").innerHTML=`<h2>Правила</h2>
  <p>2–4 игрока, любой из них может быть ботом. У каждого ${CARS_PER_PLAYER} вагонов. Цель — набрать больше очков, соединяя города из своих маршрутных билетов.</p>
  <h4>Подготовка</h4><ul><li>Каждому 4 карты вагонов, на рынке 5 открытых карт.</li><li>Каждому 1 дальний и 4 обычных маршрута, всего 5. Оставить нужно минимум 2, можно все.</li><li>Дальний маршрут дают только при старте. Если от него отказаться, он уходит из игры.</li></ul>
  <h4>Ход — одно из трёх</h4><ul>
   <li><b>Взять 2 карты</b> с рынка или из колоды. Тепловоз с рынка можно взять только первой картой, и он заменяет обе. Если на рынке 3 тепловоза, рынок обновляется.</li>
   <li><b>Построить перегон</b>: сбросить столько карт его цвета, сколько в нём вагонов. Тепловоз заменяет любой цвет. Серый перегон строится картами любого одного цвета.</li>
   <li><b>Взять 3 обычных маршрута</b> и оставить минимум 1. Дальние в игре больше не раздаются.</li></ul>
  <h4>Особые пути</h4><ul>
   <li><b>Скоростная линия</b> (Москва — Ногинск — Орехово-Зуево — Владимир): платите на 1 карту больше, чем ставите вагонов, и получаете +${EXPRESS_BONUS} очка.</li>
   <li><b>Двойной перегон</b>: один игрок не может занять оба пути. При 2–3 игроках второй путь закрывается после первой постройки.</li>
   <li><b>Вылетные направления</b> (на Пензу, Нижний Новгород, Дивеево) работают как города на краю карты.</li></ul>
  <h4>Очки за перегон</h4><p class="num">${[1,2,3,4,5,6].map(n=>`${n} ваг. — ${ROUTE_POINTS[n]}`).join(" · ")}</p>
  <h4>Конец игры</h4><ul><li>Когда у игрока остаётся 2 вагона или меньше, каждый делает ещё один ход.</li>
   <li>Выполненные билеты прибавляются, невыполненные вычитаются.</li>
   <li>Бонусы: +${RING_BONUS} за больше всех перегонов ЦКАД, +${RING_BONUS} за больше всех перегонов БМО, +${LONGEST_BONUS} за самую длинную непрерывную дорогу.</li></ul>
  <h4>Колода маршрутов: 80 билетов</h4>
  <p>Очки билета равны длине кратчайшего пути в вагонах.</p>
  <ul><li>6 дальних, от 20 вагонов.</li><li>74 обычных: 17 коротких (2–4), 40 средних (5–11), 17 длинных (12–16).</li></ul>
  <div class="tablewrap"><table class="res"><tr><th>Ценность</th>${[...new Set(REGULAR_TICKETS.map(t=>t.pts))].sort((a,b)=>a-b).map(v=>`<th>${v}</th>`).join("")}</tr>
   <tr><td>Билетов</td>${[...new Set(REGULAR_TICKETS.map(t=>t.pts))].sort((a,b)=>a-b).map(v=>`<td class="num">${REGULAR_TICKETS.filter(t=>t.pts===v).length}</td>`).join("")}</tr></table></div>
  <h4>Дальние маршруты</h4><div class="tlist" style="max-height:none">${LONG_TICKETS.map(t=>ticketHTML(t)).join("")}</div>`;
}

// =====================================================================
// TOOLTIP / VIEWBOX / INPUT
// =====================================================================
const tip=$("tip"),board=$("board");
function showTip(e,txt){tip.textContent=txt;tip.hidden=false;moveTip(e)}
function moveTip(e){const b=board.getBoundingClientRect();let x=e.clientX-b.left+14,y=e.clientY-b.top+14;
  if(x+tip.offsetWidth>b.width-6)x=e.clientX-b.left-tip.offsetWidth-10;tip.style.left=x+"px";tip.style.top=y+"px"}
function hideTip(){tip.hidden=true}
let vb;
let vbFull;
function computeFull(){
  const xs=[],ys=[];[...MOSCOW_OBL,...RYAZAN_OBL,...VLADIMIR_OBL].forEach(([lo,la])=>{const [x,y]=P(lo,la);xs.push(x);ys.push(y)});
  Object.values(cities).forEach(c=>{xs.push(c.x+90);ys.push(c.y+20)});
  const pad=24;vbFull={x:Math.min(...xs)-pad,y:Math.min(...ys)-pad,w:Math.max(...xs)-Math.min(...xs)+pad*2,h:Math.max(...ys)-Math.min(...ys)+pad*2};
}
function addGrain(){
  const g=el("g",{class:"grain"},vp),X=vbFull;
  el("rect",{x:X.x-400,y:X.y-400,width:X.w+800,height:X.h+800,filter:"url(#paperBlot)",opacity:.35},g);
  el("rect",{x:X.x-400,y:X.y-400,width:X.w+800,height:X.h+800,filter:"url(#paperGrain)",opacity:.45},g);
  el("rect",{x:X.x-400,y:X.y-400,width:X.w+800,height:X.h+800,fill:"url(#vignette)"},g);
}
function fit(){
  vb={...vbFull};applyVB();
}
const applyVB=()=>svg.setAttribute("viewBox",`${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
function toSvg(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())}
function zoom(f,cx,cy){if(cx===undefined){cx=vb.x+vb.w/2;cy=vb.y+vb.h/2}const nw=Math.min(3200,Math.max(180,vb.w*f)),k=nw/vb.w;
  vb={x:cx-(cx-vb.x)*k,y:cy-(cy-vb.y)*k,w:vb.w*k,h:vb.h*k};applyVB()}
svg.addEventListener("wheel",e=>{e.preventDefault();const p=toSvg(e);zoom(e.deltaY>0?1.15:1/1.15,p.x,p.y)},{passive:false});
$("zin").onclick=()=>zoom(1/1.3);$("zout").onclick=()=>zoom(1.3);$("zfit").onclick=fit;
let drag=null;
svg.addEventListener("pointerdown",e=>{if(drag)return;drag={mode:"pan",sx:e.clientX,sy:e.clientY,vb0:{...vb},moved:false};svg.setPointerCapture(e.pointerId);svg.classList.add("panning")});
svg.addEventListener("pointermove",e=>{if(!drag||drag.mode!=="pan")return;const b=svg.getBoundingClientRect(),s=Math.max(vb.w/b.width,vb.h/b.height);
  const dx=(e.clientX-drag.sx)*s,dy=(e.clientY-drag.sy)*s;if(Math.abs(dx)+Math.abs(dy)>2)drag.moved=true;vb.x=drag.vb0.x-dx;vb.y=drag.vb0.y-dy;applyVB()});
svg.addEventListener("pointerup",()=>{if(!drag)return;const d=drag;drag=null;svg.classList.remove("panning");
  if(d.mode==="pan"&&!d.moved){clearHL();document.querySelectorAll(".line").forEach(x=>x.classList.remove("on"));redrawMap();if(mode==="map")$("sel").textContent="Нажмите два города на карте."}
  if(d.mode==="track")onTrackClick(d.id);
  if(d.mode==="city")onCityClick(d.id)});
svg.addEventListener("pointercancel",()=>{drag=null;svg.classList.remove("panning")});
function onCityClick(id){
  if(!selA||selA===id){selA=id;hl={keys:new Set(),ends:new Set()};redrawMap();if(mode==="map")$("sel").innerHTML=`Откуда: <b>${esc(cities[id].n)}</b>. Выберите второй город.`;return}
  const p=shortest(selA,id);selA=null;setHL(p);
  const msg=p?`${chainHTML(p)}<br>Минимум <span class="num">${p.cars}</span> вагонов`:"Нет пути";
  if(mode==="map")$("sel").innerHTML=msg;else flash(p?`Кратчайший путь: ${p.cars} ваг.`:"Нет пути");
}

// tabs & toggles
function setTab(t){mode=t==="tabMap"?"map":"game";["tabGame","tabMap","tabRules"].forEach(id=>$(id).setAttribute("aria-selected",id===t));
  $("paneGame").hidden=t!=="tabGame";$("paneMap").hidden=t!=="tabMap";$("paneRules").hidden=t!=="tabRules";clearHL();render()}
["tabGame","tabMap","tabRules"].forEach(id=>$(id).onclick=()=>setTab(id));
$("tRivers").onchange=e=>$("rivers").style.display=e.target.checked?"":"none";
$("tBorders").onchange=e=>$("borders").style.display=e.target.checked?"":"none";
$("tRings").onchange=e=>gRings.style.display=e.target.checked?"":"none";
$("tLabels").onchange=e=>svg.classList.toggle("nolabels",!e.target.checked);
$("btnTickets").onclick=takeTicketsAction;
$("btnNew").onclick=showSetup;
$("modal").addEventListener("keydown",e=>{if(e.key==="Escape"&&$("pCancel"))closeModal()});

// =====================================================================
// BOOT
// =====================================================================
computeFull();drawGeo();addGrain();fit();renderMapTab();renderRules();render();showSetup();
window.__oka={G:()=>G,newGame,tracks,cities,botTurn};
})();
</script>
